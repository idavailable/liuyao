# 质量门禁：单测 + 三库差分 + 语法检查。只验证，不部署（部署走 wrangler direct upload）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装测试裁判库（devDependencies，不进生产）
        run: npm ci

      - name: 全量测试（单测 + 三库差分）
        run: npm run test:all
        env:
          TZ: Asia/Shanghai # 节气表以北京时生成，差分须同时区

      - name: 安装 UI 测试浏览器（chromium 兜底，runner 无 msedge 时用）
        run: npx playwright-core install --with-deps chromium

      - name: UI 冒烟（盲摆状态机 / 时间锁 / 追问历史）
        # test:all 不含本步，但它覆盖的状态机与历史链路最易回归，故单列一道门禁。
        # test-shake.js 内部有通道回退：msedge → chrome → 自带 chromium。
        run: |
          python3 -m http.server 8931 --directory public &
          sleep 1
          node test-shake.js http://127.0.0.1:8931

      - name: 静态语法检查（浏览器脚本 + Pages Functions）
        run: |
          node --check public/app.js
          node --check public/bgm.js
          node --check public/core/data.js
          node --check public/core/data-jieqi.js
          node --check public/core/calendar.js
          node --check public/core/paipan.js
          node --check public/core/analyze.js
          node --check public/core/sensitive.js
          node --check public/core/domain-methods.js
          node --check public/core/fact-audit.js
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON -e "
          // Functions 为 ESM（含 import 声明），动态 import 既验语法也验依赖解析
          // 注：Pages Functions 的 .js 一律按 ESM 处理，与 package.json 的 type 无关，
          //     故此处仅本地探测会有 typeless 警告，运行时无影响，显式抑制
          Promise.all(['_lib','interpret','models','records'].map(m => import('./functions/api/'+m+'.js')))
            .then(() => console.log('Functions ESM 语法与依赖解析 ✓'))
            .catch(e => { console.error('Functions 模块加载失败:', e.message); process.exit(1); });
          "
          node -e "
          const fs=require('fs');
          const html=fs.readFileSync('public/index.html','utf8');
          const s=[...html.matchAll(/<script src=\"([^\"]+)\"><\/script>/g)].map(m=>m[1]);
          // 后三个为上层契约层：依赖 paipan/analyze 的输出，必须排在 analyze.js 之后
          const expect=['core/data.js','core/data-jieqi.js','core/calendar.js','core/paipan.js','core/analyze.js','core/sensitive.js','core/domain-methods.js','core/fact-audit.js','app.js','bgm.js'];
          if(JSON.stringify(s)!==JSON.stringify(expect)){console.error('脚本加载顺序错误:',s);process.exit(1)}
          console.log('脚本加载顺序 ✓');
          "

      - name: 部署隔离断言（敏感文件不得进入部署目录）
        run: |
          # 部署根为 public/。若源码/配置/测试落到 public/ 内，会直接以静态资源
          # 形式暴露到公网（含 Account ID、D1 UUID、网关路径），此步强制拦截。
          # 背景：Cloudflare Pages direct upload 不支持 .pagesignore/.assetsignore
          #      （已实测），隔离只能靠目录物理边界，故须由 CI 守住。
          node -e "
          const fs=require('fs'), path=require('path');
          const forbidden=/^(wrangler\.toml|schema\.sql|package\.json|package-lock\.json|README\.md|\.assetsignore|\.pagesignore|\.gitignore)$/;
          const found=[];
          (function walk(d){
            for(const e of fs.readdirSync(d,{withFileTypes:true})){
              const f=path.join(d,e.name);
              if(e.isDirectory()) walk(f);
              else if(forbidden.test(e.name) || /^test-/.test(e.name) || /^tools$/.test(path.basename(d))) found.push(f);
            }
          })('public');
          if(found.length){ console.error('❌ 部署目录含敏感文件，将于公网泄露:', found); process.exit(1); }
          console.log('✅ 部署目录隔离（public/ 内无源码、配置与测试）');
          "
