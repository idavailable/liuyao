# 质量门禁：单测 + 三库差分 + 语法检查。只验证，不部署（部署走 wrangler direct upload）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装测试裁判库（devDependencies，不进生产）
        run: npm ci

      - name: 全量测试（单测 + 三库差分）
        run: npm run test:all
        env:
          TZ: Asia/Shanghai # 节气表以北京时生成，差分须同时区

      - name: 静态语法检查（浏览器脚本 + Pages Functions）
        run: |
          node --check app.js
          node --check bgm.js
          node --check core/data.js
          node --check core/calendar.js
          node --check core/paipan.js
          node --check core/analyze.js
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON -e "
          // Functions 为 ESM（含 import 声明），动态 import 既验语法也验依赖解析
          // 注：Pages Functions 的 .js 一律按 ESM 处理，与 package.json 的 type 无关，
          //     故此处仅本地探测会有 typeless 警告，运行时无影响，显式抑制
          Promise.all(['_lib','interpret','models','records'].map(m => import('./functions/api/'+m+'.js')))
            .then(() => console.log('Functions ESM 语法与依赖解析 ✓'))
            .catch(e => { console.error('Functions 模块加载失败:', e.message); process.exit(1); });
          "
          node -e "
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const s=[...html.matchAll(/<script src=\"([^\"]+)\"><\/script>/g)].map(m=>m[1]);
          const expect=['core/data.js','core/data-jieqi.js','core/calendar.js','core/paipan.js','core/analyze.js','app.js','bgm.js'];
          if(JSON.stringify(s)!==JSON.stringify(expect)){console.error('脚本加载顺序错误:',s);process.exit(1)}
          console.log('脚本加载顺序 ✓');
          "
