name = "liuyao"
# 兼容日期必须是**已过去**的日期：填未来日期 Cloudflare 会直接拒绝部署。
# 保持为「改动运行时行为的那天」，不要随手改成当天。
compatibility_date = "2026-09-24"
# 部署根仅为 public/（index.html + app.js + bgm.js + core/）。
# 源码、配置、测试、文档一律留在仓库根，不在部署范围内——
# 此前 pages_build_output_dir = "." 会把 wrangler.toml（含 Account ID、
# D1 UUID、网关路径）、schema.sql、测试脚本、README 全部作为静态资源
# 上传公网，任意人可直接下载。
# 注意：.assetsignore 对 Pages direct upload 无效（已实测），
# 唯一可靠的隔离方式就是让敏感文件不在部署目录内。
pages_build_output_dir = "public"

# 本地开发：npx wrangler pages dev public
# 线上部署后，在 Pages 项目 → Settings → Functions 中做同样的绑定

[[d1_databases]]
binding = "LIUYAO_DB"
database_name = "liuyao-db"
database_id = "42279a23-7032-42bb-b675-bb7a2015fcc0"

[vars]
# 密钥用 secret（wrangler pages secret put 或 Pages 后台加密设置），不要写进此文件：
#   GEMINI_API_KEY    Google AI Studio key（AIza 开头）
#   DEEPSEEK_API_KEY  DeepSeek key（sk- 开头）
# Gemini 走 CF AI Gateway 原生路径（绕开 Google 对数据中心 IP 的拒绝），并关闭 thinking。
# 该地址含账号 ID 与网关名，属基础设施信息，不再写进本文件（仓库可公开）：
# 已通过 `wrangler pages secret put GEMINI_BASE_URL` 设为 Pages secret（production）。
# 换账号/换网关时重设即可，模板：
#   https://gateway.ai.cloudflare.com/v1/<ACCOUNT_ID>/<GATEWAY_NAME>/google-ai-studio/v1beta
# 未配置时后端回退 Google 原生端点 generativelanguage.googleapis.com（数据中心 IP 常被拒）
DEEPSEEK_BASE_URL = "https://api.deepseek.com/v1"

# ---- 两道费用/访问闸门（2026-09-28 启用）----
# RATE_LIMIT_PER_MIN：/api/interpret 按访客 IP 的每分钟上限。**当前刻意不设 → 不限流。**
# 代码侧是软开关：未设置时 `parseInt(env.RATE_LIMIT_PER_MIN || '0', 10)` → 0 → 直接放行。
# 2026-09-28 曾设为 "20"，同日按用户要求撤销（原话「不限流」）。
# 如需恢复限流：取消下一行注释并重新 `wrangler pages deploy`。
# 取 20 的理由（供恢复时参考）：正常用法是「一次起卦 + 若干追问」，约 3~6 次/分；
# 20 留 3~5 倍余量，连公司/家庭共用出口（同 IP）也不易误伤；对脚本则把天花板压到
# 20 次/分 ≈ 2.9 万次/日/IP。注意它只在单个 isolate 内计数，属「削减」而非「根治」。
# RATE_LIMIT_PER_MIN = "20"
#
# 访问口令分两级，均为敏感值、**刻意不写在本文件**（仓库公开），改用 Pages secret 设置：
#   LIB_CODE      卦例库口令（**读 + 写**：浏览/装入/删除）。生产已设；只管卦例库，断卦不受限。
#   ACCESS_CODE   全站口令（断卦 + 卦例库读写）。生产曾于 2026-09-28 启用，同日撤销，**当前未设**。
#   设置：wrangler pages secret put LIB_CODE --project-name=liuyao
# 页面首次调用收 401 时弹框要求输入口令，存入 localStorage（键名 ly_access_code），
# 后续请求带 X-Access-Code 头。
# ⚠️ 实测：secret 变更后**线上 Functions 仍持旧环境快照**，必须重新部署一次才生效
#    （只删 secret 不部署，401 会持续 3 分钟以上）。此前"改完无需重新部署、即时生效"
#    的说法已按实测更正。
# 注意：本文件的 vars 会覆盖 Pages 后台同名「文本」变量，但**不影响** secret。

# ---- GPT / OpenAI 兼容供应商（后台也可直接设这三个变量）----
# GPT_API_KEY / GPT_BASE_URL / GPT_MODELS（逗号分隔模型名）
# 注意：本文件里写的 vars 会覆盖 Pages 后台的同名"文本"变量（secret 不受影响）；
# 用 wrangler CLI 部署时，改后台变量需同步改到这里。

# ---- 自定义供应商（任意 OpenAI 兼容接口：Kimi/Qwen/GLM/硅基流动/中转站等）----
# 后台设两个变量即可让模型出现在页面芯片上：
#   1) 文本变量 CUSTOM_PROVIDERS = JSON 数组，例如：
#      [{"id":"kimi","label":"Moonshot","base":"https://api.moonshot.cn/v1","models":["kimi-k2"]},
#       {"id":"qwen","label":"阿里云","base":"https://dashscope.aliyuncs.com/compatible-mode/v1","models":["qwen3-max","qwen3-plus"]}]
#   2) 密钥变量 <ID大写>_API_KEY，如 KIMI_API_KEY、QWEN_API_KEY
# 若用 wrangler CLI 部署，需把 CUSTOM_PROVIDERS 同步写到这里（JSON 写成单行字符串）：
# CUSTOM_PROVIDERS = '[{"id":"kimi","label":"Moonshot","base":"https://api.moonshot.cn/v1","models":["kimi-k2"]}]'

# 费用/访问闸门现状（2026-09-28 用户要求「不限流」后）：
#   LIB_CODE            → secret，生产已设（只管卦例库**写入**）
#   ACCESS_CODE         → secret，生产未设（曾启用、同日撤销，断卦恢复免口令）
#   RATE_LIMIT_PER_MIN  → 本文件 [vars]，**当前不设 = 不限流**
# → 即 /api/interpret 目前**无口令、无限流**，费用敞口仅由「入模上限 ≈ 20,000 字符」约束。
# 用户明确要求不限流，故**也不在 CF 后台另加 Rate limiting rules**（该操作 CLI 不支持，
# 且与用户意图相悖）。如需恢复，见上方 RATE_LIMIT_PER_MIN 段落。
